name: Installer download total
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  release:
    types: [published, edited]
permissions:
  contents: write
concurrency:
  group: cut-studio-download-total
  cancel-in-progress: false
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load the counter script from this exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/contents/.github/scripts/update-download-total.cjs?ref=${process.env.GITHUB_SHA}`, {headers: {Authorization: 'Bearer ' + process.env.GITHUB_TOKEN, 'User-Agent': 'CUT-STUDIO-total-downloads'}});
            if (!response.ok) throw Error('Counter source HTTP ' + response.status);
            const file = await response.json();
            fs.writeFileSync(process.env.RUNNER_TEMP + '/download-total.cjs', Buffer.from(file.content, 'base64'));
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Verify counter behavior
        run: node "$RUNNER_TEMP/download-total.cjs" --self-test
      - name: Save the aggregate download total
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/download-total.cjs"
